base:
  #  env: Dev or Test or Prod
  env: Dev

web:
  port: 8088

mongo:
  source: mongodb://127.0.0.1:27017/?maxPoolSize=20
  data_base: DBDashFun

telegram:
  token: ${telegram_bot_token}

log:
  path: ./logs/game_center.log

aws_pinpoint:
  key_id: ${aws_pinpoint_access_key_id}
  secret: ${aws_pinpoint_access_key}

admin_cfg:
  name: admin
  password: ${admin_password}
  # 后端数据查询使用的密码
  backend_password: ${admin_search_password}
  active_url: http://localhost:8080/

tencent_cos:
  bucket_url: https://dashfun-1322633994.cos.accelerate.myqcloud.com
  service_url: https://cos.ap-singapore.myqcloud.com
  secret_id: ${tencent_cos_secret_id}
  secret_key: ${tencent_cos_secret_key}

ton_cfg:
  api_key: ${ton_sdk_api_key}
  wallet_mnemonic: ${ton_op_wallet}
  wallet_version: ${ton_op_wallet_version}
  is_test: true

redis_cfg:
  address: 127.0.0.1:6379
  password:
  db: 1

invite_cfg:
    # 被邀请的用户，达到指定积分后，才算邀请成功
    point_required: 200
    # 每个成功被邀请的用户奖励的分数
    point_reward:
      - {
          #新用户奖励
          invite_user_type: 1,
          reward_point: 300,
          reward_coin: 1500,
      }
      - {
          #老用户奖励
          invite_user_type: 2,
          reward_point: 10,
          reward_coin: 150,
      }
      - {
          #非活跃用户奖励
          invite_user_type: 3,
          reward_point: 50,
          reward_coin: 500,
      }

