invite_cfg:
  # 被邀请的用户，达到指定积分后，才算邀请成功
  point_required: 2000
  # 每个成功被邀请的用户奖励的分数
  point_reward:
    - {
      #新用户奖励
      invite_user_type: 1,
      reward_point: 100,
      reward_coin: 0,
    }
    - {
      #老用户奖励
      invite_user_type: 2,
      reward_point: 10,
      reward_coin: 0,
    }
    - {
      #非活跃用户奖励
      invite_user_type: 3,
      reward_point: 10,
      reward_coin: 0,
    }

