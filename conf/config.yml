base:
  #  env: Dev or Test or Prod
  env: Dev
  mode: HowardAI

web:
  port: 8088

mongo:
  source: mongodb://127.0.0.1:27017/?maxPoolSize=20
  data_base: DBDashFun

telegram:
  token: ${telegram_bot_token}

log:
  path: ./logs/game_center.log

aws_pinpoint:
  key_id: ${aws_pinpoint_access_key_id}
  secret: ${aws_pinpoint_access_key}

admin_cfg:
  name: admin
  password: ${admin_password}
  # 后端数据查询使用的密码
  backend_password: ${admin_search_password}
  active_url: http://localhost:8080/

tencent_cos:
  bucket_url: https://dashfun-1322633994.cos.accelerate.myqcloud.com
  service_url: https://cos.ap-singapore.myqcloud.com
  secret_id: ${tencent_cos_secret_id}
  secret_key: ${tencent_cos_secret_key}

redis_cfg:
  address: 127.0.0.1:6379
  password:
  db: 1

invite_cfg:
  # 被邀请的用户，达到指定积分后，才算邀请成功
  point_required: 2000
  # 每个成功被邀请的用户奖励的分数
  point_reward:
    - {
      #新用户奖励
      invite_user_type: 1,
      reward_point: 100,
      reward_coin: 0,
    }
    - {
      #老用户奖励
      invite_user_type: 2,
      reward_point: 10,
      reward_coin: 0,
    }
    - {
      #非活跃用户奖励
      invite_user_type: 3,
      reward_point: 10,
      reward_coin: 0,
    }

coin_cfg:
  - { name: NolanDevPoint, symbol: DP, desc: NolanDev Point }
  - { name: DashFunPoint, symbol: DXP, desc: DashFun Point }
  - { name: DashFunCoin, symbol: DFC, desc: DashFun Coin, can_withdraw: true, min_withdraw: 100 }
  - { name: DashFunDiamond, symbol: Diamond, desc: DashFun Diamond }
  - { name: DashFunTicket, symbol: DFT, desc: DashFun Ticket }

leaderboard_cfg:
  - { name: "lb_gamecenter_xp_forever", score_type: "dashfun_point_total", period_type: 1, game_id: "dashfun", top_count: 20 }
  - { name: "lb_gamecenter_xp_daily", score_type: "dashfun_point_delta", period_type: 2, game_id: "dashfun", top_count: 20 }

leaderboard_bot_cfg:
  record_score_min: 10000
  bot_levels:
    - { level: 1, weight: 50, min_score: 5000, fixed_task_top: 10000, daily_top: [ 3200 ] }
    - { level: 2, weight: 20, min_score: 5000, fixed_task_top: 15000, daily_top: [ 6200,6200,6200,3200 ] }
    - { level: 3, weight: 15, min_score: 10000, fixed_task_top: 20000, daily_top: [ 6200,6200,6200,6200,6200,6200,3200 ] }
    - { level: 4, weight: 10, min_score: 10000, fixed_task_top: 20000, daily_top: [ 27200,27200,27200,6200,6200,6200,3200 ] }
    - { level: 5 , weight: 4, min_score: 30000, fixed_task_top: 27500, daily_top: [ 38200,38200,27200,6200,6200,6200,6200,6200,6200 ] }
    - { level: 6, weight: 1, min_score: 50000, fixed_task_top: 27500, daily_top: [ 51200,38200,38200,38200,27200,27200,27200,6200,6200,6200,6200,6200,6200 ] }

account_cfg:
  token_secret: ${account_token_secret}

web3_cfg:
  rpc_url: https://bsc-testnet-rpc.publicnode.com
  chain_id: 97
  private_key: ${web3_op_private_key}

open_api_cfg:
  api_key: ${open_api_key}

coingecko_cfg:
  default_token_ids: [ "bitcoin", "ethereum" ]
  update_interval: 5 # minutes

forecast_cfg:
  url: "http://localhost:8080/"

price_predict_cfg:
  open: true
  name: BNB
  symbol: BNB
  bet_start_time: 0
  bet_end_time: 20
  reveal_time: 22
  max_diff_limit: 3.0
  consolation_rate: 0.1
  max_bot_count: 500
  bet_amounts: [100, 500, 1000, 2000]

point_exchange_cfg:
  point_name: "NolanDevPoint"
  token_name: "HHA"
  token_address: "0x9DB1ac6a2E8a10A095318ED15B3221E79539BF54"
  start_time: "2026-01-21-07"
  duration_days: 30
  daily_global_limit: 20000.0
  daily_user_limit: 500.0
  exchange_rate: 20 # 1 Token = 20 Point
  
hourly_squad_game_cfg:
  open: false # 是否启用每小时的SquadGame；关闭后客户端显示为INACTIVE，用户无法进入或下注，Bot也不会参与
  min_interval_hours: 15 # Bot参与游戏的最小间隔小时数。用于控制Bot的活跃频率。值越小，每小时参与的Bot越多。
  max_interval_hours: 25 # Bot参与游戏的最大间隔小时数。平均间隔约20小时，对应每小时约250个有效Bot参与。
  contract_address: "0x5E8d94d13a588c7B725a517Ba166B781afF7BF3a"
  admin_private_key: ${squad_game_admin_key}
