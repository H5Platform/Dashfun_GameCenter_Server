definitions:
  admin.AdminUserAuth:
    enum:
    - -1
    type: integer
    x-enum-varnames:
    - AdminAuth_Admin
  admin.AdminUserLoginInfo:
    properties:
      create_at:
        type: integer
      id:
        type: string
      token:
        type: string
    type: object
  admin.AdminUserStatus:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - AdminStatus_Normal
    - AdminStatus_ResetPassword
    - AdminStatus_Ban
  api.AdminUserResponse:
    properties:
      auth:
        $ref: '#/definitions/admin.AdminUserAuth'
      email:
        type: string
      status:
        $ref: '#/definitions/admin.AdminUserStatus'
      user_id:
        type: string
      username:
        type: string
    required:
    - user_id
    type: object
  api.GetCoinsResult:
    properties:
      coins:
        items:
          $ref: '#/definitions/data.CoinData'
        type: array
      user_data:
        additionalProperties:
          $ref: '#/definitions/data.CoinUserData'
        type: object
    type: object
  api.JSONResult:
    properties:
      code:
        $ref: '#/definitions/api.ResultCode'
      data: {}
      msg:
        type: string
    type: object
  api.PaymentResponse:
    properties:
      invoiceLink:
        type: string
      paymentId:
        type: string
    type: object
  api.ResultCode:
    enum:
    - 0
    - -1
    type: integer
    x-enum-varnames:
    - Success
    - Error
  data.CoinData:
    properties:
      can_withdraw:
        description: 是否可以提取
        type: boolean
      chain_addr:
        additionalProperties:
          type: string
        description: 链上地址，chainName->address
        type: object
      desc:
        type: string
      id:
        type: string
      min_withdraw:
        description: 最低提取金额
        type: number
      name:
        type: string
      symbol:
        type: string
    type: object
  data.CoinUserData:
    properties:
      amount:
        type: number
      coin_id:
        type: string
      create_time:
        type: integer
      user_id:
        type: string
    type: object
  data.DashFunGame:
    properties:
      desc:
        type: string
      genre:
        description: 游戏类型Id
        items:
          type: integer
        type: array
      iconUrl:
        description: 游戏图标地址
        type: string
      id:
        type: string
      logoUrl:
        description: 游戏logo
        type: string
      mainPicUrl:
        description: 游戏主图地址 横向比例
        type: string
      name:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/data.DashFunGameStatus'
        description: 游戏状态
      time:
        description: 游戏入库时间
        type: integer
      url:
        description: H5游戏部署地址
        type: string
    type: object
  data.DashFunGameStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      DashFunGameStatus_NoChange: 给update使用的，无变化
      DashFunGameStatus_Online: 审核上线的游戏
      DashFunGameStatus_Pending: 刚创建的游戏，等待审核
      DashFunGameStatus_Removed: 已经下线的游戏
    x-enum-varnames:
    - DashFunGameStatus_NoChange
    - DashFunGameStatus_Pending
    - DashFunGameStatus_Online
    - DashFunGameStatus_Removed
  data.DashFunPaymentData:
    properties:
      created_at:
        description: 订单创建时间
        type: integer
      currency:
        description: 付款货币
        type: string
      description:
        description: 商品介绍
        type: string
      extraData:
        description: 附加信息
        type: string
      from:
        allOf:
        - $ref: '#/definitions/data.PaymentFrom'
        description: 付款来源渠道
      game_id:
        description: 订单所属GameId
        type: string
      id:
        description: 订单ID
        type: string
      message:
        description: 支付信息，例如失败信息等
        type: string
      pay_at:
        description: 订单支付时间
        type: integer
      payload:
        description: 携带的自定义数据
        type: string
      payment_id:
        description: 渠道方的支付Id
        type: string
      price:
        description: 付款金额
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/data.PaymentStatus'
        description: 订单状态
      title:
        description: 商品名称
        type: string
      userId:
        description: 请求订单的用户Id
        type: string
    type: object
  data.DashFunTaskCategory:
    enum:
    - 1
    - 2
    type: integer
    x-enum-comments:
      TaskCategory_Daily: 每日
    x-enum-varnames:
    - TaskCategory_Challenges
    - TaskCategory_Daily
  data.DashFunTaskCondition:
    properties:
      condition:
        description: 任务条件，不同类型条件不同
        type: string
      count:
        description: 任务要求满足条件的次数
        type: integer
      link:
        description: 任务条件相关链接
        type: string
      type:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskConditionType'
        description: 任务条件类型，不同类型任务完成方式不同
    type: object
  data.DashFunTaskConditionType:
    enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    type: integer
    x-enum-comments:
      TaskCondition_FollowX: Follow X
      TaskCondition_JoinTGChannel: 加入指定的tg channel
      TaskCondition_LevelUp: 在指定游戏中升级到指定等级
      TaskCondition_PlayGame: 玩指定游戏指定次数，游戏id在task中指定
      TaskCondition_PlayRandomGame: 订阅型任务，例如follow twitter, join tg channel...
      TaskCondition_SpendTGStars: 在TG中花费星星
    x-enum-varnames:
    - TaskCondition_PlayRandomGame
    - TaskCondition_PlayGame
    - TaskCondition_LevelUp
    - TaskCondition_JoinTGChannel
    - TaskCondition_FollowX
    - TaskCondition_SpendTGStars
  data.DashFunTaskData:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskCategory'
        description: 任务分类
      create_time:
        description: 任务创建时间
        type: integer
      game_id:
        description: 绑定游戏id，-1或""表示不限制游戏
        type: string
      id:
        description: 任务ID
        type: string
      name:
        description: 任务名称
        type: string
      open:
        description: 任务是否开启
        type: boolean
      require:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskCondition'
        description: 任务条件
      reward:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskReward'
        description: 任务奖励
      task_type:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskType'
        description: 任务类型
    type: object
  data.DashFunTaskReward:
    properties:
      amount:
        description: 奖励数量
        type: number
      reward_type:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskRewardType'
        description: 奖励类型
    type: object
  data.DashFunTaskRewardType:
    enum:
    - 1
    - 2
    type: integer
    x-enum-comments:
      TaskRewardType_DashFunPoint: 奖励dashfun point，用来兑换链上token
      TaskRewardType_DashFunToken: 奖励DashFunToken
    x-enum-varnames:
    - TaskRewardType_DashFunToken
    - TaskRewardType_DashFunPoint
  data.DashFunTaskStatus:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-comments:
      TaskStatus_Claimed: 任务奖励已领取
      TaskStatus_InProgress: 任务正在进行中
      TaskStatus_Verify_Pending: 任务需要验证
    x-enum-varnames:
    - TaskStatus_InProgress
    - TaskStatus_Verify_Pending
    - TaskStatus_Completed
    - TaskStatus_Claimed
  data.DashFunTaskType:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      TaskType_2Days: 2日任务，不知道用得上不...
      TaskType_Daily: 每日任务，每日重置
      TaskType_Normal: 普通类型任务，只能完成1次
    x-enum-varnames:
    - TaskType_Normal
    - TaskType_Daily
    - TaskType_2Days
  data.DashFunTaskUserData:
    properties:
      progress:
        description: 任务进度，max是任务对应的Condition.Count
        type: integer
      save_data:
        description: 任务进度相关数据
        type: string
      status:
        allOf:
        - $ref: '#/definitions/data.DashFunTaskStatus'
        description: 任务状态，0=in progress,1=
      task_id:
        description: task id
        type: string
      time:
        description: 任务最新一次的进度变化时间
        type: integer
      user_id:
        description: user id
        type: string
    type: object
  data.DashFunUser:
    properties:
      avatar_url:
        description: avatar地址
        type: string
      channel_id:
        description: 渠道方id
        type: string
      create_data:
        description: 创建时间
        type: integer
      display_name:
        description: 显示名称
        type: string
      from:
        allOf:
        - $ref: '#/definitions/data.DashFunUserFrom'
        description: 用户来源
      id:
        description: 全局userId
        type: string
      login_time:
        description: 登录时间
        type: integer
      logoff_time:
        description: 登出时间
        type: integer
      user_name:
        description: 用户名
        type: string
    type: object
  data.DashFunUserFrom:
    enum:
    - 1
    type: integer
    x-enum-comments:
      DF_UserFrom_TG: telegram 用户
    x-enum-varnames:
    - DF_UserFrom_TG
  data.PaymentFrom:
    enum:
    - 1
    type: integer
    x-enum-varnames:
    - DashFunPaymentFrom_TG
  data.PaymentStatus:
    enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-comments:
      DashFunPaymentStatus_Canceled: 订单已取消
      DashFunPaymentStatus_Created: 订单已创建
      DashFunPaymentStatus_Failed: 订单失败
      DashFunPaymentStatus_Paid: 订单已支付
      DashFunPaymentStatus_Pending: 等待支付
    x-enum-varnames:
    - DashFunPaymentStatus_Created
    - DashFunPaymentStatus_Pending
    - DashFunPaymentStatus_Paid
    - DashFunPaymentStatus_Canceled
    - DashFunPaymentStatus_Failed
  data.UserTaskInfo:
    properties:
      tasks:
        description: 任务列表
        items:
          $ref: '#/definitions/data.DashFunTaskData'
        type: array
      user_data:
        additionalProperties:
          $ref: '#/definitions/data.DashFunTaskUserData'
        description: 任务id对应的用户进度数据
        type: object
    type: object
info:
  contact: {}
paths:
  /api/v1/admin/game/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 游戏名称
        in: body
        name: name
        schema:
          type: string
      - description: 游戏介绍
        in: body
        name: desc
        schema:
          type: string
      - description: 游戏链接
        in: body
        name: url
        schema:
          type: string
      - description: 游戏类型
        in: body
        name: genre
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: DashFunGame
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunGame'
                  type: array
              type: object
      summary: 创建游戏
      tags:
      - Admin API
  /api/v1/admin/game/search:
    post:
      consumes:
      - application/json
      parameters:
      - description: 查询关键字
        in: body
        name: keyword
        schema:
          type: string
      - description: 查询类型
        in: body
        name: genre
        schema:
          items:
            type: integer
          type: array
      - description: 查询游戏状态
        in: body
        name: status
        schema:
          type: integer
      - description: 每页数量
        in: body
        name: size
        schema:
          type: integer
      - description: 当前页数，从1开始
        in: body
        name: page
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Search Result
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunGame'
                  type: array
              type: object
      summary: 搜索游戏
      tags:
      - Admin API
  /api/v1/admin/game/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 要更新数据的游戏Id
        in: body
        name: id
        required: true
        schema:
          type: string
      - description: 游戏名称
        in: body
        name: name
        schema:
          type: string
      - description: 游戏介绍
        in: body
        name: desc
        schema:
          type: string
      - description: 游戏链接
        in: body
        name: url
        schema:
          type: string
      - description: 游戏类型
        in: body
        name: genre
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: DashFunGame
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunGame'
                  type: array
              type: object
      summary: 更新游戏
      tags:
      - Admin API
  /api/v1/admin/game/upload_image:
    post:
      parameters:
      - description: 要更新数据的游戏Id
        in: formData
        name: game_id
        required: true
        type: string
      - description: 游戏图标，512x512
        in: formData
        name: icon
        type: file
      - description: 游戏logo
        in: formData
        name: logo
        type: file
      - description: 游戏主图，640x320
        in: formData
        name: main
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: DashFunGame
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunGame'
                  type: array
              type: object
      summary: 上传游戏相关图片
      tags:
      - Admin API
  /api/v1/admin/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户名
        in: body
        name: username
        schema:
          type: string
      - description: 密码
        in: body
        name: password
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Login Info
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/admin.AdminUserLoginInfo'
              type: object
      summary: admin登陆
      tags:
      - Admin API
  /api/v1/admin/user/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户名
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: 邮箱
        in: body
        name: email
        required: true
        schema:
          type: string
      - description: 权限
        in: body
        name: auth
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: AdminUser
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/api.AdminUserResponse'
              type: object
      summary: 创建后台账户
      tags:
      - Admin API
  /api/v1/admin/user/reset_password:
    post:
      parameters:
      - description: 用户ID
        in: formData
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AdminUser
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/api.AdminUserResponse'
              type: object
      summary: 重置用户密码
      tags:
      - Admin API
  /api/v1/admin/user/update_base_info:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户ID
        in: body
        name: user_id
        required: true
        schema:
          type: string
      - description: 用户名
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: 邮箱
        in: body
        name: email
        required: true
        schema:
          type: string
      - description: 权限
        in: body
        name: auth
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: admin user
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/api.AdminUserResponse'
              type: object
      summary: 更新用户信息
      tags:
      - Admin API
  /api/v1/admin/user/update_status:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户ID
        in: body
        name: user_id
        required: true
        schema:
          type: string
      - description: 用户状态
        in: body
        name: status
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: admin user
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/api.AdminUserResponse'
              type: object
      summary: 修改用户状态
      tags:
      - Admin API
  /api/v1/admin_search/game/{id}:
    get:
      responses: {}
  /api/v1/admin_search/user/{id}:
    get:
      responses: {}
  /api/v1/coin/get:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: coins
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/api.GetCoinsResult'
              type: object
      summary: 获取可用的coins以及用户coin相关数据
      tags:
      - Coin API
  /api/v1/game/{id}:
    get:
      parameters:
      - description: 开启的游戏Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DashFunGame
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunGame'
                  type: array
              type: object
      summary: telegram用户开启游戏
      tags:
      - Games API
  /api/v1/game/search:
    get:
      parameters:
      - description: 开启的游戏Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DashFunGame
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunGame'
                  type: array
              type: object
      summary: 用户搜索游戏
      tags:
      - Games API
  /api/v1/game_report/player_level:
    get:
      parameters:
      - description: 上报的游戏Id
        in: query
        name: game_id
        required: true
        type: string
      - description: 上报的用户Id
        in: query
        name: user_id
        required: true
        type: string
      - description: 用户等级
        in: query
        name: level
        required: true
        type: integer
      - description: 时间戳
        in: query
        name: timestamp
        required: true
        type: string
      - description: 签名字符串
        in: query
        name: sign
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 返回结果
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  type: string
              type: object
      summary: 游戏方上报玩家等级，Server端使用
      tags:
      - Game Report API
  /api/v1/payment/get:
    get:
      parameters:
      - description: 游戏Id
        in: query
        name: game_id
        required: true
        type: string
      - description: 用户Id
        in: query
        name: user_id
        required: true
        type: string
      - description: 订单ID
        in: query
        name: payment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DashFunPaymentData
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.DashFunPaymentData'
                  type: array
              type: object
      summary: 获取用户的支付订单
      tags:
      - Payment API
  /api/v1/payment/request:
    get:
      parameters:
      - description: 请求支付的游戏Id
        in: query
        name: game_id
        required: true
        type: string
      - description: 支付项目名称
        in: query
        name: title
        required: true
        type: string
      - description: 支付项目描述
        in: query
        name: desc
        required: true
        type: string
      - description: 自定义数据
        in: query
        name: payload
        required: true
        type: string
      - description: 支付金额
        in: query
        name: price
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: payment info
          schema:
            allOf:
            - $ref: '#/definitions/api.JSONResult'
            - properties:
                data:
                  $ref: '#/definitions/api.PaymentResponse'
              type: object
      summary: telegram用户请求支付订单
      tags:
      - Payment API
  /api/v1/task/claim:
    get:
      parameters:
      - description: 游戏Id
        in: query
